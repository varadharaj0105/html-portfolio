<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neon Grid · Tic Tac Toe</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#2d2746,transparent 53%),#101420;color:#f7f8fc;font:16px Roboto,system-ui,sans-serif;min-height:100vh}main{width:min(100%,460px);margin:auto;padding:24px 20px}header{display:flex;align-items:center;gap:12px}header i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#a6ffcb;color:#101420;font:bold 26px monospace;transform:rotate(-5deg)}h1{font-size:30px;letter-spacing:-1.8px;margin:0}small{color:#aeb7cc}button{font:inherit;color:inherit;border:none;cursor:pointer}nav{display:flex;background:#090d16;border:1px solid #303748;padding:4px;border-radius:16px;margin:24px 0}nav button{flex:1;background:transparent;padding:12px 2px;color:#adb6c9;border-radius:12px}nav [aria-pressed=true]{color:white;background:#30364a;font-weight:bold}.status{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 12px}h2{font-size:22px;margin:0;letter-spacing:-.7px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{aspect-ratio:1;border-radius:18px;background:linear-gradient(145deg,#252c3e,#1a2031);border:1px solid #394056;display:grid;place-items:center}.cell:empty:after{content:'';width:5px;height:5px;background:#4b5368;border-radius:50%}.mark{width:55%;aspect-ratio:1;position:relative;animation:pop .18s ease-out}.X:before,.X:after{content:'';position:absolute;left:45%;height:110%;top:-5%;width:11%;background:#a6ffcb;border-radius:10px;transform:rotate(45deg)}.X:after{transform:rotate(-45deg)}.O{border:6px solid #b9a4ff;border-radius:50%}.win{background:#263d39;border-color:#a6ffcb}.scores{display:flex;margin:20px 0;text-align:center;background:#191f2e;border-radius:16px;padding:14px 0}.scores div{flex:1}.scores div+div{border-left:1px solid #353b4c}.scores b{display:block;font-size:22px}.scores small{font-size:12px}#again{background:#a6ffcb;color:#101b18;width:100%;padding:15px;border-radius:14px;font-weight:750}@keyframes pop{from{transform:scale(.65);opacity:.3}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main><header><i aria-hidden="true">#</i><div><h1>Neon Grid</h1><small>Tic Tac Toe</small></div></header><nav aria-label="Game mode"><button id="solo">Versus CPU</button><button id="duo">Two players</button></nav><div class="status"><h2 id="status" aria-live="polite"></h2><small id="round"></small></div><section class="board" aria-label="Game board"></section><div class="scores"><div><b id="sx"></b><small id="lx"></small></div><div><b id="sd"></b><small>Draws</small></div><div><b id="so"></b><small id="lo"></small></div></div><button id="again"></button></main><script src="game.js"></script></body></html>

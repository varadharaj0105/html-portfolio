name: Build Neon Grid APK
on:
  push:
    branches: [neon-tic-tac-toe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Neon-Grid.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Neon-Grid-Android
          path: Neon-Grid.apk
      - name: Publish downloadable APK on game branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Neon-Grid.apk
          git commit -m "Publish signed Neon Grid debug APK"
          git push origin HEAD:neon-tic-tac-toe
